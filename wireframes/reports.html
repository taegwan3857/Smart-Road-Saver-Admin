<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신고문서 - Smart Road Saver</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar-placeholder"></aside>
    <div class="main-wrapper">
      <header class="header" id="header-placeholder"></header>
      <main class="content-area">
        <div class="page-header-wrap">
          <div class="page-title">신고 문서 관리</div>
          <div class="page-subtitle">지자체 및 유관 부서로 전송되는 긴급 조치 기안 문서를 관리합니다.</div>
        </div>
        
        <div class="panel">
          <div class="board-filters">
            <div class="filter-group">
              <select class="form-select">
                <option>진행 상태 전체</option>
                <option>결재 대기</option>
                <option>접수 완료</option>
                <option>반려</option>
              </select>
              <div class="search-box">
                <input type="text" class="form-input" placeholder="문서 번호 또는 담당자 검색">
                <button class="btn-primary">검색</button>
              </div>
            </div>
            <div class="filter-group">
              <button class="btn-primary" style="background: var(--text-main);"><i class="fas fa-plus"></i> 수동 신고 등록</button>
              <button class="btn-outline">인쇄 / PDF 저장</button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width: 40px; text-align: center;"><input type="checkbox"></th>
                  <th>문서 번호</th>
                  <th>기안 일시</th>
                  <th>제목 (위험 유형)</th>
                  <th>관련 감지 ID</th>
                  <th>담당자</th>
                  <th>결재 상태</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody>
                <tr onclick="window.location.href='report-detail.html'" style="cursor:pointer;">
                  <td style="text-align: center;" onclick="event.stopPropagation();"><input type="checkbox"></td>
                  <td style="font-weight: 500;">DOC-2026-0158</td>
                  <td>2026-09-04 18:40</td>
                  <td style="text-align: left;">서대문구 연희로 10길 결빙(블랙아이스) 조치 요청</td>
                  <td>DT-20260904-001</td>
                  <td>김관리</td>
                  <td><span class="badge neutral">결재 대기</span></td>
                  <td onclick="event.stopPropagation();">
                    <div class="action-buttons">
                      <a href="report-detail.html" class="btn-small" style="text-decoration: none; display: inline-block;">검토</a>
                    </div>
                  </td>
                </tr>
                <tr onclick="window.location.href='report-detail.html'" style="cursor:pointer;">
                  <td style="text-align: center;" onclick="event.stopPropagation();"><input type="checkbox"></td>
                  <td style="font-weight: 500;">DOC-2026-0157</td>
                  <td>2026-09-04 15:20</td>
                  <td style="text-align: left;">종로구 세종대로 1 포트홀 보수 요청</td>
                  <td>DT-20260904-002</td>
                  <td>이순찰</td>
                  <td><span class="badge low">접수 완료</span></td>
                  <td onclick="event.stopPropagation();">
                    <div class="action-buttons">
                      <a href="report-detail.html" class="btn-small" style="text-decoration: none; display: inline-block;">검토</a>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="board-pagination">
            <a href="#" class="page-btn"><i class="fas fa-angle-left"></i></a>
            <a href="#" class="page-btn active">1</a>
            <a href="#" class="page-btn"><i class="fas fa-angle-right"></i></a>
          </div>

        </div>
      </main>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
