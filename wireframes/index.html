<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대시보드 - Smart Road Saver</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar-placeholder"></aside>
    <div class="main-wrapper">
      <header class="header" id="header-placeholder"></header>
      <main class="content-area">
        <div class="page-header-wrap">
          <div class="page-title">대시보드</div>
          <div class="page-subtitle">전체 시스템 요약 및 도로 위험 감지 현황을 한눈에 파악할 수 있습니다.</div>
        </div>
        
        <!-- 검색 및 필터 영역 (게시판 스타일 재사용) -->
        <div class="panel" style="margin-bottom: 24px; padding: 20px 24px;">
          <div class="board-filters" style="margin-bottom: 0;">
            <div class="filter-group">
              <select class="form-select">
                <option>위험 유형 전체</option>
                <option>블랙아이스</option>
                <option>포트홀</option>
                <option>장애물/낙하물</option>
              </select>
              <select class="form-select">
                <option>위험도 전체</option>
                <option>높음 (High)</option>
                <option>주의 (Medium)</option>
              </select>
              <select class="form-select">
                <option>기간 설정: 오늘</option>
                <option>최근 1주일</option>
                <option>최근 1개월</option>
              </select>
              <div class="search-box" style="margin-left: 8px;">
                <input type="text" class="form-input" placeholder="위치 또는 ID 검색">
                <button class="btn-primary">검색</button>
              </div>
            </div>
          </div>
        </div>
        
        <div class="dashboard-grid">
          <!-- 위험 위치 지도 -->
          <div class="panel span-9" style="padding: 0; overflow: hidden; display: flex; flex-direction: column;">
            <div class="panel-header" style="padding: 20px 24px 0; border-bottom: none;">
              위험 위치 지도 (서울시)
            </div>
            <div class="map-placeholder" style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Seoul_districts.png/800px-Seoul_districts.png'); background-size: cover; background-position: center; border-radius: 0; min-height: 500px;">
              <div style="position: absolute; inset: 0; background: rgba(255, 255, 255, 0.6);"></div>
              <!-- 마커들 -->
              <div style="position: absolute; top: 40%; left: 30%; background: var(--color-danger); width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.2);"></div>
              <div style="position: absolute; top: 60%; left: 50%; background: var(--color-warning); width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.2);"></div>
              <div style="position: absolute; top: 35%; left: 65%; background: var(--color-danger); width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.2);"></div>
            </div>
          </div>

          <!-- 감지 위치 목록 -->
          <div class="panel span-3" style="display: flex; flex-direction: column; max-height: 560px;">
            <div class="panel-header">
              감지 위치 목록
              <span class="badge neutral">총 12건</span>
            </div>
            <div style="flex: 1; overflow-y: auto; padding-right: 8px;">
              <!-- 리스트 아이템 1 -->
              <div class="alert-list-item" onclick="window.location.href='detection-detail.html'" style="cursor:pointer; padding: 16px 20px;">
                <div class="alert-item-header">
                  <div class="alert-item-title" style="font-size: 0.95rem; font-weight: 700; color: var(--color-danger);">
                    <span class="status-dot danger"></span> 블랙아이스 감지
                  </div>
                  <div class="alert-item-time" style="font-weight: 500;">18:32</div>
                </div>
                <div class="alert-item-body" style="margin-bottom: 0; padding-left: 18px;">
                  <div style="color: var(--text-main); font-weight: 600; margin-bottom: 4px; font-size: 1.05rem;">서대문구 연희로 10길</div>
                  <div style="font-size: 0.85rem; color: #94a3b8;"><i class="fas fa-map-marker-alt"></i> 37.5729, 126.9794</div>
                </div>
              </div>

              <!-- 리스트 아이템 2 -->
              <div class="alert-list-item" onclick="window.location.href='detection-detail.html'" style="cursor:pointer; padding: 16px 20px;">
                <div class="alert-item-header">
                  <div class="alert-item-title" style="font-size: 0.95rem; font-weight: 700; color: var(--color-warning);">
                    <span class="status-dot warning"></span> 포트홀 감지
                  </div>
                  <div class="alert-item-time" style="font-weight: 500;">17:15</div>
                </div>
                <div class="alert-item-body" style="margin-bottom: 0; padding-left: 18px;">
                  <div style="color: var(--text-main); font-weight: 600; margin-bottom: 4px; font-size: 1.05rem;">강남구 강남대로 24</div>
                  <div style="font-size: 0.85rem; color: #94a3b8;"><i class="fas fa-map-marker-alt"></i> 37.5123, 127.0211</div>
                </div>
              </div>

              <!-- 리스트 아이템 3 -->
              <div class="alert-list-item" onclick="window.location.href='detection-detail.html'" style="cursor:pointer; padding: 16px 20px;">
                <div class="alert-item-header">
                  <div class="alert-item-title" style="font-size: 0.95rem; font-weight: 700; color: var(--color-danger);">
                    <span class="status-dot danger"></span> 블랙아이스 감지
                  </div>
                  <div class="alert-item-time" style="font-weight: 500;">14:40</div>
                </div>
                <div class="alert-item-body" style="margin-bottom: 0; padding-left: 18px;">
                  <div style="color: var(--text-main); font-weight: 600; margin-bottom: 4px; font-size: 1.05rem;">종로구 세종대로 1</div>
                  <div style="font-size: 0.85rem; color: #94a3b8;"><i class="fas fa-map-marker-alt"></i> 37.5702, 126.9768</div>
                </div>
              </div>

            </div>
          </div>

        </div>
      </main>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
