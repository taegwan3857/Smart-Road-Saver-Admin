<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>위험 위치 지도 - Smart Road Saver</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar-placeholder"></aside>
    <div class="main-wrapper">
      <header class="header" id="header-placeholder"></header>
      <main class="content-area" style="display: flex; flex-direction: column; padding: 0;">
        <!-- 지도는 전체 영역을 덮도록 설정 -->
        <div style="flex: 1; position: relative;">
          <div class="placeholder-block" style="border: none; border-radius: 0; background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Seoul_districts.png/800px-Seoul_districts.png'); background-size: cover; background-position: center;">
            <div style="position: absolute; inset: 0; background: rgba(255, 255, 255, 0.4);"></div>
            <!-- 지도 마커들 -->
            <i class="fas fa-map-marker-alt text-danger" style="position: absolute; top: 45%; left: 35%; font-size: 2.5rem; text-shadow: 0 0 5px white;"></i>
            <i class="fas fa-map-marker-alt text-warning" style="position: absolute; top: 65%; left: 55%; font-size: 2.5rem; text-shadow: 0 0 5px white;"></i>
            
            <!-- 우측 플로팅 패널 -->
            <div class="panel" style="position: absolute; top: 20px; right: 20px; width: 300px; z-index: 10;">
              <div class="panel-header">필터 및 상세 정보</div>
              <div class="form-group">
                <label>위험 유형</label>
                <select style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                  <option>전체</option>
                  <option>블랙아이스</option>
                  <option>포트홀</option>
                </select>
              </div>
              <p style="margin-top: 20px; color: var(--text-muted); font-size: 0.9rem;">마커를 클릭하면 상세 정보가 표시됩니다.</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
