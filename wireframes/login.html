<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - Smart Road Saver</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .login-page {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: var(--bg-body);
      background-image: radial-gradient(circle at center, #ffffff 0%, #f4f7f9 100%);
    }

    /* 화면 전체를 덮지 않고, 중앙에 900px 크기로 분할된 카드 */
    .login-card-split {
      display: flex;
      width: 100%;
      max-width: 900px;
      min-height: 500px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .login-left {
      flex: 1.2;
      background-color: var(--primary-color);
      color: white;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    
    /* 장식용 패턴 */
    .login-left::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 50%);
      pointer-events: none;
    }

    .login-left h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .login-left p {
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
    }

    .login-right {
      flex: 1;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-right h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--text-main);
      font-weight: 700;
    }

    .login-right p.subtitle {
      color: var(--text-muted);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.2s;
      background-color: #f8fafc;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary-color);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(29, 49, 98, 0.1);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-login:hover {
      background-color: var(--primary-hover);
    }
    
    @media (max-width: 768px) {
      .login-card-split {
        flex-direction: column;
        max-width: 400px;
        margin: 20px;
      }
      .login-left {
        padding: 40px 30px;
        text-align: center;
      }
      .login-right {
        padding: 40px 30px;
      }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card-split">
      <!-- 왼쪽: 브랜딩 영역 -->
      <div class="login-left">
        <i class="fas fa-shield-alt" style="font-size: 3rem; margin-bottom: 20px;"></i>
        <h1>Smart Road Saver</h1>
        <p>실시간 센서 데이터와 AI 분석으로<br>도로 위의 위험을 가장 먼저 감지합니다.</p>
      </div>
      <!-- 오른쪽: 로그인 폼 영역 -->
      <div class="login-right">
        <h2>관리자 로그인</h2>
        <p class="subtitle">계정 정보를 입력하세요.</p>
        
        <form id="loginForm">
          <div class="form-group">
            <label>아이디</label>
            <input type="text" id="userId" placeholder="admin" required value="admin">
          </div>
          <div class="form-group">
            <label>비밀번호</label>
            <input type="password" id="userPw" placeholder="1234" required value="1234">
          </div>
          <button type="submit" class="btn-login">로그인</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const id = document.getElementById('userId').value;
      const pw = document.getElementById('userPw').value;

      if (id === 'admin' && pw === '1234') {
        window.location.href = 'index.html';
      } else {
        showModal({
          title: '로그인 실패',
          message: '아이디 또는 비밀번호가 올바르지 않습니다.<br>다시 확인해 주세요.',
          type: 'error'
        });
      }
    });
  </script>
</body>
</html>
