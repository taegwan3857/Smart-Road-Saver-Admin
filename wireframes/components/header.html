<!-- Left Side: Real-time Ticker -->
<div class="header-left">
  <div class="live-ticker">
    <span style="color: var(--color-danger); display: flex; align-items: center; gap: 6px; font-weight: 700;">
      <i class="fas fa-circle" style="font-size: 0.6rem; animation: pulse-dot 1.5s infinite;"></i> 실시간 감지
    </span>
    <div style="width: 1px; height: 14px; background: #cbd5e1;"></div>
    <span style="color: var(--text-main); font-weight: 600;">[서대문구] 연희로 10길 블랙아이스 위험 감지</span>
    <a href="live.html" style="margin-left: 12px; color: var(--primary-color); font-size: 0.85rem; text-decoration: none; font-weight: 700;">관제 화면 <i class="fas fa-chevron-right" style="font-size: 0.7rem;"></i></a>
  </div>
</div>

<!-- Right Side: Clock & Profile -->
<div class="header-right" style="display: flex; align-items: center; gap: 16px;">
  <div style="display: flex; align-items: center; gap: 8px; font-size: 0.95rem; color: var(--text-muted);">
    <i class="far fa-clock"></i> <span id="clock" style="font-family: monospace; font-size: 1.05rem; font-weight: 500;">--:--:--</span>
  </div>
  <div style="width: 1px; height: 24px; background: var(--border-light); margin: 0 8px;"></div>
  <div style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; color: var(--text-main);">
    <div style="width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
      <i class="fas fa-user"></i>
    </div>
    최고 관리자
  </div>
</div>
